<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ukkarii</title>
<style>
  @font-face {
    font-family: 'Fraunces';
    src: local('Fraunces');
  }
  :root{
    --paper:#FAF6EF;
    --paper-line:#E4DCC9;
    --ink:#22262E;
    --ink-soft:#5B5A52;
    --amber:#C1793B;
    --teal:#2E5F58;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .card{
    width:100%;
    max-width:520px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:52px;
    line-height:1;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  p.tagline{
    font-size:16px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:38ch;
    margin:0 0 40px;
  }
  .index{
    border-top:1px solid var(--paper-line);
  }
  .entry{
    display:flex;
    align-items:baseline;
    gap:18px;
    padding:18px 2px;
    border-bottom:1px solid var(--paper-line);
    text-decoration:none;
    color:inherit;
  }
  .entry .no{
    font-family:Georgia, serif;
    font-style:italic;
    font-size:15px;
    color:var(--amber);
    flex:none;
    width:20px;
  }
  .entry .label{
    flex:1;
  }
  .entry .title{
    display:block;
    font-size:17px;
    font-weight:600;
    margin-bottom:3px;
  }
  .entry .sub{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
  }
  .entry .go{
    flex:none;
    font-size:20px;
    color:var(--paper-line);
    transition:transform .15s ease, color .15s ease;
  }
  .entry:hover .go{
    color:var(--amber);
    transform:translateX(3px);
  }
  .entry:hover .title{
    color:var(--teal);
  }
  footer{
    margin-top:32px;
    font-size:12px;
    color:var(--ink-soft);
  }
  @media (prefers-reduced-motion: reduce){
    .entry .go{ transition:none; }
  }
</style>
</head>
<body>

  <main class="card">
    <p class="eyebrow">projectukkari</p>
    <h1>ukkarii</h1>
    <p class="tagline">Tugas sekolah — tautan cepat ke dokumen, kode sumber, dan versi yang sudah dipublikasikan.</p>

    <nav class="index">
      <a class="entry" href="Dokumentasi_UI_PustakaLokal.docx" download>
        <span class="no">01</span>
        <span class="label">
          <span class="title">Dokumen</span>
          <span class="sub">Dokumentasi UI (.docx) — unduh berkas</span>
        </span>
        <span class="go">→</span>
      </a>

      <a class="entry" href="https://github.com/aricahmangkelii/ukkarii" target="_blank" rel="noopener">
        <span class="no">02</span>
        <span class="label">
          <span class="title">Repo GitHub</span>
          <span class="sub">Kode sumber &amp; riwayat perubahan</span>
        </span>
        <span class="go">→</span>
      </a>

      <a class="entry" href="https://tugasukk.freedev.app" target="_blank" rel="noopener">
        <span class="no">03</span>
        <span class="label">
          <span class="title">InfinityFree</span>
          <span class="sub">tugasukk.freedev.app — versi terpasang</span>
        </span>
        <span class="go">→</span>
      </a>
    </nav>

    <footer>Aricahmangkelii · ukkarii</footer>
  </main>

</body>
</html>
